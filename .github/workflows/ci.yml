name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nyxel.slnx

      - name: Format check
        run: dotnet format Nyxel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Nyxel.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Nyxel.slnx --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack Nyxel.slnx --no-build -c Release -o build/packages

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/packages/*.nupkg
