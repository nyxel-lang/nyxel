name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nyxel.slnx

      - name: Format check
        run: dotnet format Nyxel.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Nyxel.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Nyxel.slnx --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack Nyxel.slnx --no-build -c Release -o build/packages

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/packages/*.nupkg

  highlighting:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: tools/vscode-nyxel

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/vscode-nyxel/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Highlighting snapshots
        run: npm test
